server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:${APPLICATION_SERVICE_NAME:platform-service}}
  # ==========================================
  # DATABASE - PostgreSQL
  # ==========================================
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://192.168.0.107:5432/service-payment}
    username: ${DATABASE_USERNAME:service-payment}
    password: ${DATABASE_PASSWORD:service-payment}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  sql:
    init:
      mode: always
# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging:
  http:
    enabled: ${HTTP_LOGGING_ENABLED:true}
    log-request-body: ${HTTP_LOGGING_REQUEST_BODY:true}
    log-response-body: ${HTTP_LOGGING_RESPONSE_BODY:true}
    max-body-size: ${HTTP_LOGGING_MAX_BODY_SIZE:10000}
    excluded-paths: ${HTTP_LOGGING_EXCLUDED_PATHS:}
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:logstash}
      file: ${LOGGING_STRUCTURED_FORMAT:logstash}
  file:
    name: ${LOG_FILE:logs/platform-service.log}
    max-size: ${LOG_MAX_FILE_SIZE:10MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}

  level:
    root: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

application:
  service:
    name: ${APPLICATION_SERVICE_NAME:platform-service}
  environment: ${APPLICATION_ENVIRONMENT:development}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With}
  exposed-headers: ${CORS_EXPOSED_HEADERS:}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  max-age: ${CORS_MAX_AGE:3600}

whatsapp:
  gateway:
    base-url: ${WHATSAPP_GATEWAY_BASE_URL:http://192.168.0.107:8009}
  session:
    pending-expiration: ${WHATSAPP_SESSION_PENDING_EXPIRATION:1m}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://192.168.0.107:11434}
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:qwen3-embedding}
    timeout: ${OLLAMA_EMBEDDING_TIMEOUT:120s}

qdrant:
  base-url: ${QDRANT_BASE_URL:http://192.168.0.107:6333}
  collection-name: ${QDRANT_COLLECTION_NAME:knowledge}
  vector-size: ${QDRANT_VECTOR_SIZE:4096}
  timeout: ${QDRANT_TIMEOUT:30s}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration: ${JWT_EXPIRATION:3600}
